site_name: Azure Administrator (AZ-104) Study Guide
site_author: Han
site_url: https://yoonghan.github.io/AZ-104-Azure-Administrator-Associate

theme:
  name: material
  palette:
    # Deep Azure Blue for a professional Microsoft feel
    - scheme: default
      primary: azure
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: azure
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - search.suggest

nav:
  - Home: index.md
  - Topics:
    - Infrastructure.md
    - Commands.md
    - EntraId:
      - EntraId.md
      - User.md
    - Storage-Account.md
    - Encryption.md
    - Networking:
      - Virtual-Network.md
      - DNS.md
      - Network-Security-Group.md
      - Load-Balancers.md
    - Virtual-Machines.md
    - Web-Application.md
    - Containers.md
    - Backup.md
    - AzurePolicy.md
    - Monitoring.md
    - Roles.md
    - KeyVault.md
    - Budget.md
  - AZ-305:
    - AZ-305/BluePrint.md
    - AZ-305/RelationalDB.md
    - AZ-305/DataIntegration.md
    - AZ-305/Compute.md
    - AZ-305/ApplicationArchitecture.md
    - AZ-305/VPN.md
    - AZ-305/Migration.md
    - AZ-305/Others.md
  - Exam: 
    - Exam_Preparation/Notes.md
    - Exam_Preparation/Labs.md
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
