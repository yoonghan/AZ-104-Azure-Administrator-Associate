site_name: Azure Administrator (AZ-104) Study Guide
site_author: Han
site_url: https://yoonghan.github.io/AZ-104-Azure-Administrator-Associate

theme:
  name: material
  palette:
    # Deep Azure Blue for a professional Microsoft feel
    - scheme: default
      primary: azure
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: azure
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - search.suggest

nav:
  - Home: index.md
  - Topics:
    - Command.md
  - Exam: 
    - Exam_Preparation/Notes.md
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
